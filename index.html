<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QUANTUM PORTAL // CROSS-SCREEN AIR-FLING</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; touch-action: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #030712;
      font-family: 'Share Tech Mono', monospace;
      color: #00f0ff;
    }
    #portalCanvas { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

    /* Tactical HUD */
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 10;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 8px; padding: 14px 20px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
      pointer-events: auto; backdrop-filter: blur(10px);
      max-width: 360px;
    }

    .title {
      font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900;
      color: #00f0ff; letter-spacing: 2px; margin-bottom: 6px;
    }

    .room-badge {
      display: inline-block; font-size: 22px; font-weight: 900;
      color: #00ffcc; letter-spacing: 4px; font-family: 'Orbitron', sans-serif;
      background: rgba(0, 255, 204, 0.1); border: 1px dashed #00ffcc;
      padding: 6px 14px; border-radius: 4px; margin: 6px 0;
    }

    .connect-row { display: flex; gap: 8px; margin-top: 8px; }
    input {
      background: #020617; border: 1px solid #00f0ff;
      color: #00ffcc; padding: 8px 12px; font-family: inherit; font-size: 16px;
      width: 120px; text-align: center; letter-spacing: 2px;
    }
    button {
      background: #00f0ff; color: #020617; border: none;
      padding: 8px 18px; font-family: 'Orbitron', sans-serif;
      font-weight: 700; font-size: 12px; cursor: pointer; border-radius: 4px;
    }
    button:hover { background: #00ffcc; }

    #status-pill {
      font-size: 12px; font-weight: bold; margin-top: 6px;
      color: #8b9bb4;
    }
    #status-pill.online { color: #00ff88; }

    .instructions {
      font-size: 12px; color: #64748b; text-align: center;
      background: rgba(3, 7, 18, 0.7); padding: 8px; border-radius: 4px;
    }
  </style>

  <!-- PeerJS: Serverless Real-Time WebRTC Data Channel -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <canvas id="portalCanvas"></canvas>

  <div id="hud">
    <!-- Top Controller -->
    <div class="glass-card">
      <div class="title">QUANTUM PORTAL BRIDGE</div>
      
      <div id="host-section">
        <div style="font-size:11px; color:#8b9bb4;">THIS SCREEN PORTAL PIN:</div>
        <div class="room-badge" id="my-pin">----</div>
      </div>

      <div id="join-section">
        <div style="font-size:11px; color:#8b9bb4;">ENTER PIN TO LINK SCREEN:</div>
        <div class="connect-row">
          <input type="text" id="target-pin" maxlength="4" placeholder="0000" />
          <button onclick="linkToPortal()">LINK</button>
        </div>
      </div>

      <div id="status-pill">INITIALIZING QUANTUM BRIDGE...</div>
    </div>

    <div class="instructions" id="guide-text">
      PLACE PHONES/SCREENS SIDE-BY-SIDE // FLING SPHERE OFF ANY EDGE
    </div>
  </div>

  <script>
    const canvas = document.getElementById('portalCanvas');
    const ctx = canvas.getContext('2d');
    const myPinEl = document.getElementById('my-pin');
    const statusPill = document.getElementById('status-pill');
    const guideText = document.getElementById('guide-text');

    let audioCtx = null;
    let peer = null;
    let conn = null;

    // --- 1. SPATIAL ORB PHYSICS ENGINE ---
    const orb = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      radius: 40,
      active: false, // True if the orb is currently on THIS screen
      isDragging: false,
      color: '#00f0ff',
      trail: []
    };

    let dragHistory = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (orb.active && orb.x === 0 && orb.y === 0) {
        orb.x = canvas.width / 2;
        orb.y = canvas.height / 2;
      }
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 2. AUDIO SYNTHESIZER (WHOOSH & IMPACT) ---
    function playWhooshSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.exponentialRampToValueAtTime(880, t + 0.25);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.25);
    }

    function playImpactSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      
      // Resonant glass chime
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(150, t + 0.35);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.35);
    }

    // --- 3. SERVERLESS WEBRTC LINK (PEERJS) ---
    // Generate unique 4-digit PIN for simple pairing
    const myPin = Math.floor(1000 + Math.random() * 9000).toString();
    myPinEl.innerText = myPin;

    peer = new Peer(`portal-air-fling-${myPin}`);

    peer.on('open', () => {
      statusPill.innerText = "READY // AWAITING LINK";
      // First screen starts with the orb!
      if (!orb.active && !conn) {
        orb.active = true;
        orb.x = canvas.width / 2;
        orb.y = canvas.height / 2;
      }
    });

    // Handle incoming screen connection
    peer.on('connection', (c) => {
      setupConnection(c);
      // Give the orb to the guest phone so they can fling it first!
      orb.active = false;
    });

    function linkToPortal() {
      const pin = document.getElementById('target-pin').value.trim();
      if (pin.length !== 4) return alert("Enter valid 4-digit PIN");
      
      statusPill.innerText = "CONNECTING TO SCREEN...";
      const c = peer.connect(`portal-air-fling-${pin}`, { reliable: true });
      setupConnection(c);

      // Connected phone receives the orb!
      orb.active = true;
      orb.x = canvas.width / 2;
      orb.y = canvas.height * 0.7;
    }

    function setupConnection(c) {
      conn = c;
      conn.on('open', () => {
        statusPill.innerText = "BRIDGE ESTABLISHED // LINKED";
        statusPill.className = "online";
        guideText.innerText = "SWIPE ORB FAST TOWARDS ANY SCREEN EDGE TO TRANSFER!";
      });

      // RECEIVE INCOMING ORB FROM OTHER SCREEN!
      conn.on('data', (data) => {
        if (data.type === 'WARP_IN') {
          handleIncomingWarp(data);
        }
      });
    }

    // --- 4. THE INTER-DIMENSIONAL FLING LOGIC ---
    function sendWarpOut(edge, normalizedRatio, vx, vy) {
      if (!conn) return;

      playWhooshSound();
      orb.active = false; // Vanishes from this screen!

      conn.send({
        type: 'WARP_IN',
        edge: edge, // 'TOP', 'BOTTOM', 'LEFT', 'RIGHT'
        ratio: normalizedRatio, // 0.0 to 1.0 along the edge
        vx: vx,
        vy: vy
      });
    }

    function handleIncomingWarp(data) {
      playImpactSound();
      orb.active = true;
      orb.trail = [];

      // Physical entry mapping based on which edge it left the other screen:
      if (data.edge === 'TOP') {
        // Enters from bottom edge moving upwards
        orb.x = data.ratio * canvas.width;
        orb.y = canvas.height + orb.radius;
        orb.vx = data.vx * 0.9;
        orb.vy = Math.min(-15, data.vy); // Rockets upwards!
      } else if (data.edge === 'BOTTOM') {
        // Enters from top edge moving downwards
        orb.x = data.ratio * canvas.width;
        orb.y = -orb.radius;
        orb.vx = data.vx * 0.9;
        orb.vy = Math.max(15, data.vy); // Rockets downwards!
      } else if (data.edge === 'RIGHT') {
        // Enters from left edge moving right
        orb.x = -orb.radius;
        orb.y = data.ratio * canvas.height;
        orb.vx = Math.max(15, data.vx);
        orb.vy = data.vy * 0.9;
      } else if (data.edge === 'LEFT') {
        // Enters from right edge moving left
        orb.x = canvas.width + orb.radius;
        orb.y = data.ratio * canvas.height;
        orb.vx = Math.min(-15, data.vx);
        orb.vy = data.vy * 0.9;
      }
    }

    // --- 5. TOUCH & MOUSE FLING MECHANICS ---
    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function onPointerDown(e) {
      if (!orb.active) return;
      const p = getPointerPos(e);
      const dist = Math.hypot(p.x - orb.x, p.y - orb.y);

      if (dist < orb.radius * 1.5) {
        orb.isDragging = true;
        orb.vx = 0;
        orb.vy = 0;
        dragHistory = [{ x: p.x, y: p.y, t: performance.now() }];
      }
    }

    function onPointerMove(e) {
      if (!orb.isDragging || !orb.active) return;
      const p = getPointerPos(e);
      orb.x = p.x;
      orb.y = p.y;

      const now = performance.now();
      dragHistory.push({ x: p.x, y: p.y, t: now });
      if (dragHistory.length > 6) dragHistory.shift();
    }

    function onPointerUp(e) {
      if (!orb.isDragging || !orb.active) return;
      orb.isDragging = false;

      if (dragHistory.length >= 2) {
        const first = dragHistory[0];
        const last = dragHistory[dragHistory.length - 1];
        const dt = (last.t - first.t) / 1000;
        if (dt > 0.01) {
          orb.vx = (last.x - first.x) / dt * 0.035;
          orb.vy = (last.y - first.y) / dt * 0.035;
        }
      }
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp, { passive: false });

    // --- 6. RENDER LOOP & PARTICLES ---
    function animate() {
      requestAnimationFrame(animate);

      // Motion Blur trail
      ctx.fillStyle = 'rgba(2, 5, 12, 0.28)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (orb.active) {
        if (!orb.isDragging) {
          // Physics movement
          orb.x += orb.vx;
          orb.y += orb.vy;

          // Friction
          orb.vx *= 0.985;
          orb.vy *= 0.985;

          // --- DETECT FLINGING OFF EDGES (THE TRANSFER PORTAL) ---
          if (conn && conn.open) {
            // Fling off TOP edge
            if (orb.y < 0 && orb.vy < -5) {
              sendWarpOut('TOP', orb.x / canvas.width, orb.vx, orb.vy);
              return;
            }
            // Fling off BOTTOM edge
            if (orb.y > canvas.height && orb.vy > 5) {
              sendWarpOut('BOTTOM', orb.x / canvas.width, orb.vx, orb.vy);
              return;
            }
            // Fling off RIGHT edge
            if (orb.x > canvas.width && orb.vx > 5) {
              sendWarpOut('RIGHT', orb.y / canvas.height, orb.vx, orb.vy);
              return;
            }
            // Fling off LEFT edge
            if (orb.x < 0 && orb.vx < -5) {
              sendWarpOut('LEFT', orb.y / canvas.height, orb.vx, orb.vy);
              return;
            }
          }

          // Elastic bounce if not connected or not fast enough to escape
          if (orb.x < orb.radius) { orb.x = orb.radius; orb.vx *= -0.75; }
          if (orb.x > canvas.width - orb.radius) { orb.x = canvas.width - orb.radius; orb.vx *= -0.75; }
          if (orb.y < orb.radius) { orb.y = orb.radius; orb.vy *= -0.75; }
          if (orb.y > canvas.height - orb.radius) { orb.y = canvas.height - orb.radius; orb.vy *= -0.75; }
        }

        // Particle Trail
        orb.trail.push({ x: orb.x, y: orb.y, r: orb.radius });
        if (orb.trail.length > 15) orb.trail.shift();

        for (let i = 0; i < orb.trail.length; i++) {
          const pt = orb.trail[i];
          const alpha = i / orb.trail.length;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, (orb.radius * 0.7) * alpha, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 240, 255, ${alpha * 0.25})`;
          ctx.fill();
        }

        // Draw Glowing Plasma Energy Sphere
        const grad = ctx.createRadialGradient(orb.x, orb.y, 4, orb.x, orb.y, orb.radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, '#00ffcc');
        grad.addColorStop(0.7, '#00f0ff');
        grad.addColorStop(1, 'rgba(0, 240, 255, 0)');

        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Pulsing Corona Ring
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius + Math.sin(performance.now() * 0.008) * 4, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    animate();
  </script>
</body>
</html>
